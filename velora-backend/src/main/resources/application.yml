server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: velora-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/velora}}
      database: ${MONGODB_DATABASE:velora}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# JWT and Security Settings
velora:
  admin:
    initial-user: ${ADMIN_INITIAL_USER:admin}
    initial-password: ${ADMIN_INITIAL_PASSWORD:velora2026!}
  jwt:
    # 256-bit base64 secret key
    secret: ${JWT_SECRET:vElOrABoTaNiCaL2026sEcReTkEySuPeRsEcUrE9876543210}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.velorafiori.it,https://velorafiori.it,https://velora-six-kappa.vercel.app,http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.velora: DEBUG
    org.springframework.security: INFO
